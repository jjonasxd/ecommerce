<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 404 | E-commerce</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<style>
    * {
        box-sizing: border-box;
        padding: 0px;
        margin: 0px;
        font-family: sans-serif;
    }
    body {
        background-color: #ececec;
    }
    .wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .erro-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 50px;
        border-radius: 30px;
        background-color: #ffffff;
        color: #000;
        margin: 100px;
        box-shadow: 5px 5px 10px #00000027;
        text-align: center;
    }
    .erro-container h1 {
        font-size: 50px;
        font-weight: 800;
    }
    a {
        text-decoration: None;
    }
    .erro-container a {
        margin-top: 50px;
        padding: 10px;
        border-radius: 10px;
        background-color: black;
        font-weight: 800;
        font-size: 20px;
        color: white;
        width: 100%;
        transition: ease-in-out 0.2s;
    }
    .erro-container a:hover {
        transform: translateY(-2px);
    }
    .erro-container a:active {
        transform: scale(0.98);
    }
    .icon{
        width: 150px;
        height: 150px;
        animation: flutuar 2.5s ease-in-out infinite alternate;
    }
    @keyframes flutuar {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }
</style>
<body>
    <main class="wrapper">
        <div class="erro-container">
            <svg class="icon" viewBox="0 0 610 512" aria-hidden="true">

                </path>
            </svg>
            <h1>404 - Página não encontrada</h1>
            <p>Ops! parece que essa página não existe, não ha problema busque por mais</p>
            <a href="/pages/produtos/">Volte as compras</a>
        </div>
    </main>
